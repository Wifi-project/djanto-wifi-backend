services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djanto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - djanto_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    env_file:
      - .env
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - djanto_network

  web:
    build: .
    image: wifi-web:latest
    container_name: django
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - djanto_network

  celery_worker:
    build: .
    image: wifi-web:latest
    container_name: djanto-celery-worker
    # Utilise sh pour lancer celery sans passer par entrypoint.sh (migrations)
    entrypoint: ["/bin/sh", "-c"]
    command: ["celery -A config worker --loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      web:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - djanto_network

  celery_beat:
    build: .
    image: wifi-web:latest
    container_name: djanto-celery-beat
    entrypoint: ["/bin/sh", "-c"]
    command: ["celery -A config beat --loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      web:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - djanto_network

networks:
  djanto_network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data: